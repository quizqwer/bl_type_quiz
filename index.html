  :root{
    --bg:#f5f3ee; --surface:#ffffff; --surface-2:#eae6dd;
    --ink:#211f1c; --ink-soft:#6b665d; --line:rgba(33,31,28,0.12);
    --accent:#3c6e63; --accent-soft:rgba(60,110,99,0.12); --accent-strong:#2c5048;
    --gold:#a98f4b; --track:#eae6dd;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17181a; --surface:#212224; --surface-2:#2a2b2d;
      --ink:#ece9e2; --ink-soft:#a7a39a; --line:rgba(236,233,226,0.12);
      --accent:#6fb3a3; --accent-soft:rgba(111,179,163,0.16); --accent-strong:#8fcabc;
      --gold:#d1b872; --track:#2a2b2d;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17181a; --surface:#212224; --surface-2:#2a2b2d;
    --ink:#ece9e2; --ink-soft:#a7a39a; --line:rgba(236,233,226,0.12);
    --accent:#6fb3a3; --accent-soft:rgba(111,179,163,0.16); --accent-strong:#8fcabc;
    --gold:#d1b872; --track:#2a2b2d;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"GenSenRounded TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    line-height:1.7; padding:40px 24px 72px;
  }
  .wrap{ max-width:460px; margin:0 auto; }
  .stage{ display:none; }
  .stage.active{ display:block; animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .top-nav{ display:flex; align-items:center; margin-bottom:18px; }
  .hub-link{ display:inline-flex; align-items:center; gap:4px; font-size:13.5px; font-weight:700; color:var(--ink-soft); text-decoration:none; align-self:flex-start; }
  .hub-link:hover{ color:var(--accent); }

  .eyebrow{ font-size:13px; font-weight:700; letter-spacing:.08em; color:var(--accent-strong); margin:0 0 10px; }
  h1{ font-size:25px; line-height:1.4; margin:0 0 14px; }
  p.lede{ color:var(--ink-soft); font-size:15px; margin:0 0 14px; }
  .intro-icon{ display:block; width:150px; height:auto; margin:0 auto 18px; }
  .q-footnote{ margin:20px 0 0; font-size:12.5px; line-height:1.65; color:var(--ink-soft); text-align:center; }

  .card{ background:var(--surface); border-radius:20px; padding:22px 20px; box-shadow:0 18px 40px -28px rgba(0,0,0,0.35); margin-bottom:16px; }

  .start-btn, .option-btn, .primary-btn{
    display:block; width:100%; text-align:left; border:none; cursor:pointer;
    font-family:inherit; font-size:15.5px; line-height:1.55; color:var(--ink);
    background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:15px 16px; margin-bottom:10px;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .option-btn:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .option-btn:active{ transform:scale(0.99); }
  .option-btn.option-selected{ border-color:var(--accent); background:var(--accent-soft); font-weight:700; }
  .start-btn, .primary-btn{ background:var(--accent); color:#fff; text-align:center; font-weight:700; border:none; font-size:16px; padding:16px; }
  .start-btn:hover, .primary-btn:hover{ background:var(--accent-strong); }
  .secondary-btn{ display:block; width:100%; text-align:center; background:transparent; border:none; color:var(--ink-soft); font-size:14px; padding:10px; cursor:pointer; text-decoration:underline; font-family:inherit; }

  .progress-wrap{ margin-bottom:18px; }
  .progress-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .back-btn{ font-size:12.5px; color:var(--ink-soft); background:none; border:none; padding:4px 2px; margin:-4px -2px; cursor:pointer; font-family:inherit; border-radius:6px; }
  .back-btn:hover{ color:var(--accent-strong); }
  .back-btn:disabled{ visibility:hidden; }
  .progress-track{ height:6px; border-radius:999px; background:var(--track); overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:999px; transition:width .3s ease; }
  .progress-label{ font-size:12.5px; color:var(--ink-soft); }
  .q-text{ font-size:18px; font-weight:700; margin-bottom:18px; line-height:1.55; }

  .footer-note{ margin:18px 0 0; font-size:12.5px; line-height:1.75; color:var(--ink-soft); text-align:center; }

  /* ---- manga info card ---- */
  .manga-title{ font-size:21px; font-weight:800; line-height:1.4; margin:0 0 8px; }
  .manga-row{ display:flex; align-items:center; flex-wrap:wrap; gap:8px 12px; margin-bottom:4px; }
  .manga-status{ display:inline-block; font-size:11.5px; font-weight:700; color:var(--accent-strong); background:var(--accent-soft); padding:2px 9px; border-radius:999px; }
  .manga-author{ font-size:12.5px; color:var(--ink-soft); }
  .manga-rating{ font-size:13px; font-weight:700; color:var(--gold); }
  .tag-row{ display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 14px; }
  .tag-pill{ font-size:12px; font-weight:700; color:var(--accent-strong); background:var(--accent-soft); padding:5px 11px; border-radius:999px; }
  .manga-synopsis-label{ font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .manga-synopsis{ font-size:14.5px; line-height:1.75; }
  .trait-head{ font-size:12.5px; font-weight:700; color:var(--accent-strong); letter-spacing:.04em; margin-bottom:4px; }
  .trait-name{ font-size:22px; font-weight:800; line-height:1.35; margin-bottom:8px; }
  .trait-line{ font-size:14.5px; line-height:1.75; color:var(--ink); background:var(--surface-2); border-radius:14px; padding:12px 14px; margin-bottom:6px; }
  .profile-item{ padding:13px 0 0; }
  .profile-label{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--accent-strong); margin-bottom:3px; }
  .profile-label::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--gold); flex:none; }
  .profile-text{ font-size:14px; line-height:1.75; color:var(--ink-soft); padding-left:12px; }
  .pair-row{ margin:8px 0 0 12px; padding:10px 12px; border-radius:12px; background:var(--surface-2); }
  .pair-top{ display:flex; align-items:center; gap:8px; margin-bottom:3px; }
  .pair-tag{ font-size:11.5px; font-weight:700; color:#fff; background:var(--accent); padding:2px 8px; border-radius:999px; }
  .pair-who{ font-size:14px; font-weight:700; }
  .pair-desc{ font-size:13.5px; line-height:1.65; color:var(--ink-soft); }

  /* ---- axis gauge ---- */
  .gauge-title{ font-size:15px; font-weight:800; margin:0 0 4px; }
  .gauge-sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 16px; line-height:1.6; }
  .gauge-group-label{ font-size:12px; font-weight:700; color:var(--accent-strong); margin:14px 0 10px; letter-spacing:.04em; }
  .axis-row{ margin-bottom:14px; }
  .axis-row:last-child{ margin-bottom:0; }
  .axis-top{ display:flex; justify-content:space-between; align-items:baseline; font-size:13.5px; margin-bottom:5px; }
  .axis-name{ font-weight:700; }
  .axis-pct{ color:var(--accent-strong); font-weight:700; }
  .axis-track{ position:relative; height:8px; border-radius:999px; background:var(--track); }
  .axis-fill{ position:absolute; left:0; top:0; height:100%; background:var(--accent); border-radius:999px; }
  .axis-ref{ position:absolute; top:-4px; width:2px; height:16px; background:var(--gold); border-radius:1px; transform:translateX(-50%); }
  .axis-ends{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); margin-top:4px; }
  .gauge-legend{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); margin-top:14px; }
  .gauge-legend i{ display:inline-block; width:2px; height:12px; background:var(--gold); }
</style>
</head>

    {t:"肉，越多越好，劇情可以先放一邊", s:3},
    {t:"劇情跟肉都要有，張力拉滿", s:2},
    {t:"曖昧拉扯，十指相扣就能尖叫", s:1},
    {t:"純愛日常，牽手就是全劇高潮", s:0} ]},
  { axis:"S", text:"兩個人關上房門之後，你希望漫畫畫到哪裡？", options:[
    {t:"每個細節都畫出來：喘息、汗水、交纏的身體，一路到天亮", s:3},
    {t:"畫到衣服一件件被脫掉、被壓上床，下一格直接跳到隔天早上", s:2},
    {t:"只畫一個深吻、十指緊扣，然後畫面轉黑", s:1},
    {t:"兩個人蓋著棉被聊天，抱著睡到天亮，什麼都沒發生", s:0} ]},
  { axis:"S", text:"看到「高H」標籤，你會？", options:[
    {t:"立刻點進去，順手收藏", s:3},
    {t:"先看評論，風評好就看", s:2},
    {t:"有點害羞，偷偷看一點點", s:1},
    {t:"直接跳過，我是清水派", s:0} ]},
];

var AXIS_COUNT = {};
QUESTIONS.forEach(function(q){ AXIS_COUNT[q.axis] = (AXIS_COUNT[q.axis] || 0) + 1; });

var answers = [];
var currentIndex = 0;
var stageIntro = document.getElementById("stage-intro");
var stageQuestion = document.getElementById("stage-question");
var stageResult = document.getElementById("stage-result");

function showStage(stage){
  [stageIntro, stageQuestion, stageResult].forEach(function(s){ s.classList.remove("active"); });
  stage.classList.add("active");
  window.scrollTo({top:0, behavior:"instant"});
}

function renderQuestion(){
  window.scrollTo({top:0, behavior:"instant"});
  var q = QUESTIONS[currentIndex];
  document.getElementById("progress-label").textContent = "第 " + (currentIndex+1) + " 題／共 " + QUESTIONS.length + " 題";
  document.getElementById("progress-fill").style.width = Math.round((currentIndex / QUESTIONS.length) * 100) + "%";
  document.getElementById("q-text").textContent = q.text;
  document.getElementById("back-btn").disabled = currentIndex === 0;

  var optWrap = document.getElementById("q-options");
  optWrap.innerHTML = "";
  q.options.forEach(function(opt, optIndex){
    var btn = document.createElement("button");
    btn.className = "option-btn";
    btn.type = "button";
    btn.textContent = opt.t;
    if (answers[currentIndex] && answers[currentIndex].optIndex === optIndex) btn.classList.add("option-selected");
    btn.addEventListener("click", function(){
      answers[currentIndex] = { axis:q.axis, score:opt.s, optIndex:optIndex };
      if (currentIndex < QUESTIONS.length - 1) { currentIndex++; renderQuestion(); }
      else { renderResult(); }
    });
    optWrap.appendChild(btn);
  });
}

document.getElementById("back-btn").addEventListener("click", function(){
  if (currentIndex > 0) { currentIndex--; renderQuestion(); }
});

function nearest(list, scores, keys){
  var best = null, bestD = Infinity;
  list.forEach(function(item){
    var d = 0;
    keys.forEach(function(k){ d += Math.pow(item[k] - scores[k], 2); });
    if (d < bestD) { bestD = d; best = item; }
  });
  return best;
}

function renderAxisRows(container, axes, scores, ref){
  container.innerHTML = "";
  axes.forEach(function(ax){
    var pct = Math.round(scores[ax.id] * 10);
    var refPct = ref[ax.id] * 10;
    var row = document.createElement("div");
    row.className = "axis-row";
    row.innerHTML =
      "<div class='axis-top'><span class='axis-name'>" + ax.label + "</span><span class='axis-pct'>" + pct + "%</span></div>" +
      "<div class='axis-track'><div class='axis-fill' style='width:" + pct + "%;'></div><div class='axis-ref' style='left:" + refPct + "%;'></div></div>" +
      "<div class='axis-ends'><span>" + ax.low + "</span><span>" + ax.high + "</span></div>";
    container.appendChild(row);
  });
}

function renderResult(){
  var sums = {};
  answers.forEach(function(a){ sums[a.axis] = (sums[a.axis] || 0) + a.score; });
  var scores = {};
  Object.keys(AXIS_COUNT).forEach(function(k){ scores[k] = (sums[k] || 0) / (AXIS_COUNT[k] * 3) * 10; });

  var arch = nearest(ARCHETYPES, scores, ["R","A","H","E","M"]);
  var flav = nearest(FLAVORS, scores, ["F","S"]);
  var entry = RESULTS[arch.id + "|" + flav.id];

  document.getElementById("manga-title").textContent = entry.title;
  document.getElementById("manga-author").textContent = "作者：" + entry.author;
  document.getElementById("manga-rating").textContent = "★ " + entry.rating.toFixed(2);

  var tagsEl = document.getElementById("manga-tags");
  tagsEl.innerHTML = "";
  [flav.label, arch.label].concat(entry.tags).filter(function(t, i, arr){ return arr.indexOf(t) === i; }).forEach(function(t){
    var pill = document.createElement("span");
    pill.className = "tag-pill";
    pill.textContent = t;
    tagsEl.appendChild(pill);
  });
  document.getElementById("manga-synopsis").textContent = entry.synopsis;
  var pf = arch.profile;
  document.getElementById("manga-trait").innerHTML =
    "<div class='trait-head'>你的攻受原型</div>" +
    "<div class='trait-name'>" + arch.label + "</div>" +
    "<div class='trait-line'>" + arch.trait + "</div>" +
    [["外表與形象", pf.look], ["性格特質", pf.personality], ["反差萌", pf.gap]].map(function(it){
      return "<div class='profile-item'><div class='profile-label'>" + it[0] + "</div><div class='profile-text'>" + it[1] + "</div></div>";
    }).join("") +
    "<div class='profile-item'><div class='profile-label'>常見搭配</div>" +
    pf.pair.map(function(pr){
      return "<div class='pair-row'><div class='pair-top'><span class='pair-tag'>" + pr[0] + "</span><span class='pair-who'>× " + pr[1] + "</span></div><div class='pair-desc'>" + pr[2] + "</div></div>";
    }).join("") + "</div>";

  document.getElementById("gauge-arch-label").textContent = "攻受原型指數 → " + arch.label;
  renderAxisRows(document.getElementById("gauge-arch"), AXES, scores, arch);
  document.getElementById("gauge-flav-label").textContent = "故事風味指數 → " + flav.label;
  renderAxisRows(document.getElementById("gauge-flav"), FLAVOR_AXES, scores, flav);

  var scoreMap = {};
  AXES.concat(FLAVOR_AXES).forEach(function(ax){ scoreMap[ax.label] = Math.round(scores[ax.id] * 10); });
  sendBackendEvent({
    type: "complete",
    result: arch.label, cat1: arch.role, cat2: flav.label, note: entry.title,
    scores: scoreMap
  });

  showStage(stageResult);
}

// 後台紀錄：只送結果跟指數，不收集任何可識別身份的資訊
var BACKEND_URL = "https://script.google.com/macros/s/AKfycbyzB-dzh_CVBdB38ciezr_k2qI10MBPipc702FhKeeGDoxbaGbVtZ6xaEjhlTJ89HPVXg/exec";

function sendBackendEvent(payload){
  if (!BACKEND_URL) return;
  payload.quiz = "BL攻受設定";
  try {
    fetch(BACKEND_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).catch(function(){});
  } catch (err) {}
}

function startQuiz(){
  answers = []; currentIndex = 0;
  sendBackendEvent({ type: "start" });
  showStage(stageQuestion); renderQuestion();
}
document.getElementById("start-btn").addEventListener("click", startQuiz);
document.getElementById("retry-btn").addEventListener("click", startQuiz);
document.getElementById("share-hint-btn").addEventListener("click", function(){
  alert("把這個畫面截圖，傳給朋友或分享到限動，讓他們也來測一下吧！");
});
</script>
